name: discover-ats
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - name: 先确保名单存在
        run: |
          if [ ! -f igmetall.yaml ]; then python import_igm.py auto > import.log 2>&1; cat import.log; fi
      - name: 批量探测
        run: |
          set +e
          python discover_all.py > discover.log 2>&1
          echo "exit=$?" >> discover.log
          tail -40 discover.log
      - name: 存回
        if: always()
        run: |
          git config user.name jobwatch-bot
          git config user.email actions@users.noreply.github.com
          git add -A && git commit -m "ATS 探测结果" || true
          git push
