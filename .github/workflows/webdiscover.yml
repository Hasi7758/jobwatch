name: web-discover
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - run: |
          set +e
          python discover_web.py > webdiscover.log 2>&1
          echo "exit=$?" >> webdiscover.log
          grep -c "✓" webdiscover.log
      - if: always()
        run: |
          git config user.name jobwatch-bot
          git config user.email actions@users.noreply.github.com
          git add -A && git commit -m "官网探测结果" || true
          git push
