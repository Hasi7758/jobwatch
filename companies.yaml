# ============================================================
#  目标公司列表 —— 这里是"比 StepStone 早 3~14 天"的来源
# ============================================================
#
#  重要:下面这份初始列表里的 ats/slug 我无法联网验证,只能算候选。
#  第一步请先跑探测,用探测结果覆盖它:
#
#      python jobwatch.py discover personio celonis flixbus scalablecapital
#
#  探测成功的会打印出可直接粘贴的 yaml。探不到的公司,手动打开它的
#  招聘页,看点"申请"之后 URL 跳到哪个域名:
#      jobs.personio.de      -> ats: personio,   slug 是域名第一段
#      boards.greenhouse.io  -> ats: greenhouse, slug 是 /boards/ 后面那段
#      jobs.lever.co         -> ats: lever
#      jobs.smartrecruiters  -> ats: smartrecruiters
#      *.recruitee.com       -> ats: recruitee
#      jobs.ashbyhq.com      -> ats: ashby
#      apply.workable.com    -> ats: workable
#      join.com              -> ats: join
#      *.myworkdayjobs.com   -> ats: workday(要填完整 url,见文件末尾)

companies:
  # ---- 先留空,等你跑完 discover 再填 ----
  # 格式:
  # - name: Celonis
  #   ats: greenhouse
  #   slug: celonis
  #
  # Workday 特殊,不用 slug,要完整接口地址:
  # - name: Siemens
  #   ats: workday
  #   url: https://siemens.wd3.myworkdayjobs.com/wday/cxs/siemens/Careers/jobs
  #   (拿法:打开公司 Workday 招聘页 -> F12 Network -> 搜 "jobs" 的 POST 请求)


